<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ASD Hockey Club Roma — Calendario partite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Colori Roma */
    --roma-red:#8E1F2F;
    --roma-red-dark:#6E1522;
    --roma-red-tint:#F8E3E6;
    --roma-gold:#F0BC42;
    --roma-gold-tint:#FFF3CC;
    --roma-gold-ink:#6B4D00;
    --roma-orange-tint:#FDE9DA;
    --roma-orange-ink:#8A3A0E;

    /* Neutri su sfondo bianco */
    --page-bg:#FFFFFF;
    --card-bg:#FFFFFF;
    --ink:#1F1A1A;
    --ink-soft:#5A5050;
    --rule:#E2DAD6;
    --past-bg:#F3F1F0;
    --past-ink:#6B6363;
    --radius:10px;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  header.top{
    background:var(--roma-red);
    color:#FFFFFF;
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
    border-bottom:5px solid var(--roma-gold);
  }
  header.top::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:180px; height:180px;
    border:2px solid rgba(255,255,255,0.14);
    border-radius:50%;
  }
  header.top::before{
    content:"";
    position:absolute;
    right:20px; bottom:-60px;
    width:130px; height:130px;
    border:2px solid rgba(255,255,255,0.10);
    border-radius:50%;
  }
  .crest{
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
  }
  .crest-mark{
    flex-shrink:0;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  .club-name{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.5px;
    color:#FFFFFF;
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:clamp(26px,6vw,34px);
    margin:16px 0 4px;
    line-height:1.1;
    position:relative;
    color:#FFFFFF;
  }
  .sub{
    font-size:14.5px;
    color:#FFF3CC;
    max-width:480px;
    line-height:1.4;
    position:relative;
    margin:0;
  }

  .controls{
    position:sticky;
    top:0;
    z-index:20;
    background:#FFFFFF;
    padding:14px 20px 12px;
    border-bottom:1px solid var(--rule);
    display:flex;
    flex-wrap:wrap;
    gap:10px 14px;
    align-items:center;
    justify-content:space-between;
  }
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    appearance:none;
    border:1.5px solid #CFC6C0;
    background:#FFFFFF;
    color:#4A4040;
    font-family:'Source Sans 3', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:7px 14px 7px 12px;
    border-radius:999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .chip .dot{
    width:8px;height:8px;border-radius:50%;
    background:#CFC6C0;
    flex-shrink:0;
  }
  .chip[data-cat="U16"].active{
    border-color:#B7860B;
    background:var(--roma-gold-tint);
    color:var(--roma-gold-ink);
  }
  .chip[data-cat="U16"].active .dot{background:#E0A300;}
  .chip[data-cat="U18"].active{
    border-color:#C2571A;
    background:var(--roma-orange-tint);
    color:var(--roma-orange-ink);
  }
  .chip[data-cat="U18"].active .dot{background:#D9651F;}
  .chip[data-cat="U20"].active{
    border-color:var(--roma-red);
    background:var(--roma-red-tint);
    color:var(--roma-red-dark);
  }
  .chip[data-cat="U20"].active .dot{background:var(--roma-red);}

  .toggle-wrap{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13.5px;
    font-weight:600;
    color:#3F3636;
  }
  .switch{
    position:relative;
    width:38px;height:22px;
    flex-shrink:0;
  }
  .switch input{
    opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;z-index:2;
  }
  .track{
    position:absolute;inset:0;
    background:#BDB4AE;
    border-radius:999px;
    transition:background .15s ease;
  }
  .knob{
    position:absolute;
    top:3px;left:3px;
    width:16px;height:16px;
    background:#FFFFFF;
    border-radius:50%;
    box-shadow:0 1px 2px rgba(0,0,0,0.3);
    transition:transform .15s ease;
  }
  .switch input:checked ~ .track{background:var(--roma-red);}
  .switch input:checked ~ .knob{transform:translateX(16px);}

  main{
    max-width:640px;
    margin:0 auto;
    padding:8px 20px 60px;
  }

  .month-heading{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.5px;
    color:var(--roma-red);
    margin:26px 0 10px;
    padding-bottom:6px;
    border-bottom:2px solid var(--roma-gold);
  }

  .match{
    display:flex;
    gap:14px;
    background:var(--card-bg);
    border:1px solid var(--rule);
    border-left:4px solid var(--roma-gold);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
    align-items:flex-start;
  }
  .match.is-past{
    background:var(--past-bg);
    border-color:var(--rule);
    border-left-color:#CFC6C0;
  }
  .match.is-past .teams,
  .match.is-past .venue,
  .match.is-past .time,
  .match.is-past .teams .roma{
    color:var(--past-ink);
  }

  .date-block{
    flex-shrink:0;
    width:52px;
    text-align:center;
    padding-top:2px;
  }
  .date-block .day{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:24px;
    line-height:1;
    color:var(--roma-red);
  }
  .match.is-past .date-block .day{color:var(--past-ink);}
  .date-block .dow{
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-top:3px;
  }

  .details{flex:1; min-width:0;}
  .details-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:4px;
  }
  .tags{display:flex; gap:6px; flex-wrap:wrap;}
  .tag{
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:5px;
    letter-spacing:0.2px;
  }
  .tag.cat-U16{background:var(--roma-gold-tint); color:var(--roma-gold-ink);}
  .tag.cat-U18{background:var(--roma-orange-tint); color:var(--roma-orange-ink);}
  .tag.cat-U20{background:var(--roma-red-tint); color:var(--roma-red-dark);}
  .tag.home{background:var(--roma-red); color:#FFFFFF;}
  .tag.away{background:#ECE7E4; color:#3F3636;}
  .tag.indoor{background:var(--ink); color:var(--roma-gold);}

  .time{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
    white-space:nowrap;
  }

  .teams{
    font-size:15px;
    font-weight:600;
    line-height:1.35;
    color:var(--ink);
    margin-bottom:3px;
  }
  .teams .roma{color:var(--roma-red); font-weight:700;}

  .venue{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .venue.main{
    font-size:15px;
    font-weight:600;
    color:var(--ink);
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .empty strong{display:block; font-family:'Oswald', sans-serif; font-size:17px; color:var(--ink); margin-bottom:6px; font-weight:600;}

  footer{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:10px 20px 30px;
  }

  @media (max-width:380px){
    .date-block{width:44px;}
    .date-block .day{font-size:21px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="crest">
    <svg class="crest-mark" width="54" height="62" viewBox="0 0 54 62" xmlns="http://www.w3.org/2000/svg">
